<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HundredGames - Cutscene</title>
<link rel="stylesheet" href="cutscene.css">
</head>
<body>

  <div class="cs-scene" id="csScene">
    <img class="cs-layer" id="csBg"          src="../shared/assets/images/cutscene/bg-cutscene.png" alt="">
    <img class="cs-layer" id="csTopCloud"    src="../shared/assets/images/cutscene/bg-topcloud.png" alt="">
    <img class="cs-layer" id="csBottomCloud" src="../shared/assets/images/cutscene/bg-buttomcloud.png" alt="">
    <img class="cs-layer" id="csDark1"       src="../shared/assets/images/cutscene/bg-darkcutscene.png" alt="">
    <img class="cs-layer" id="csDark2"       src="../shared/assets/images/cutscene/bg-darkcutscene2.png" alt="">
    <img class="cs-layer" id="csDark3"       src="../shared/assets/images/cutscene/bg-darkcutscene3.png" alt="">

    <div class="brick-wall" id="brickWall"></div>

    <img class="title-img" id="titleImg" src="" alt="">

    <!-- audio -->
    <audio id="a-war-drums"    src="../shared/assets/audio/cutscene/war-drums.mp3"></audio>
    <audio id="a-cloud-wind"   src="../shared/assets/audio/cutscene/cloud-wind.mp3"></audio>
    <audio id="a-thunder"      src="../shared/assets/audio/cutscene/thunder.mp3"></audio>
    <audio id="a-rain"         src="../shared/assets/audio/cutscene/rain.mp3"></audio>
    <audio id="a-collapse"     src="../shared/assets/audio/cutscene/collapse.mp3"></audio>
    <audio id="a-brick-buildup" src="../shared/assets/audio/cutscene/brick-buildup.mp3"></audio>
    <audio id="a-title-impact" src="../shared/assets/audio/cutscene/title-impact.mp3"></audio>
    <audio id="a-title-sword"  src="../shared/assets/audio/cutscene/title-sword.mp3"></audio>
  </div>

  <script src="cutscene.js"></script>
</body>
</html>
